name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QR dependency
        run: python -m pip install -r requirements.txt
      - name: JavaScript and setup checks
        run: |
          for file in app/*.js; do node --check "$file"; done
          for file in tests/*.cjs; do node "$file"; done
          python -m unittest discover -s tests -p 'test_*.py'
      - name: PHP and integration checks
        run: |
          php --version
          php -l app/api.php
          php -l app/config.example.php
          php -r 'if (!extension_loaded("pdo_sqlite")) { exit(1); }'
          python tests/check-api.py
